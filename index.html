<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open MealBuddy</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7e6;
      display: flex;

      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 32px;

    h1 { font-size: 34px; margin-bottom: 14px; }

      padding: 22px 34px;
      border-radius: 18px;
      text-decoration: none;
      background: #ffffff;
      border: 3px solid #222222;
      color: #111111;
      font-weight: bold;
    }

<body>
  <div class="card">
    <h1>MealBuddy 🍎</h1>
    <p>Tap the button below to open MealBuddy.</p>
